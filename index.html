<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>法令本文</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(calc(100% - 3rem), 110rem); margin: 3.5rem auto; }
    #layout { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, 62rem); gap: 2rem; align-items: start; }
    #layout.has-toc { grid-template-columns: 25rem minmax(0, 62rem); }
    #layout.has-metadata:not(.has-toc) { grid-template-columns: minmax(0, 62rem) 16rem; }
    #layout.has-toc.has-metadata { grid-template-columns: 25rem minmax(0, 62rem) 16rem; }
    #layout:not(.has-toc) { justify-content: center; }
    #left-rail, #toc-panel, #law-main, #right-rail { min-width: 0; }
    #left-rail[hidden], #right-rail[hidden] { display: none; }
    #left-rail { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; max-height: calc(100vh - 3rem); min-height: 0; }
    #article-jump-panel { flex: 0 0 auto; }
    #toc-panel { flex: 1 1 auto; min-height: 0; overflow: auto; }
    #toc-panel h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    #article-jump { margin: 0; }
    #article-jump label { display: block; margin-bottom: 0.4rem; font-weight: 700; }
    #article-jump-controls { display: flex; gap: 0.5rem; }
    #article-jump-input { flex: 1 1 auto; min-width: 0; }
    #article-jump-status { margin: 0.4rem 0 0; }
    #right-rail { position: sticky; top: 1.5rem; align-self: start; display: flex; flex-direction: column; height: calc(100vh - 3rem); min-height: 0; }
    #right-rail h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    #right-rail dl { margin: 0; }
    #right-rail dt { margin-top: 0.9rem; font-weight: 700; }
    #right-rail dd { margin: 0.2rem 0 0; overflow-wrap: anywhere; }
    #metadata-list .external-link-mark { white-space: nowrap; font-size: 0.85em; }
    #metadata-panel { flex: 0 0 auto; min-width: 0; }
    #amendment-panel { flex: 1 1 auto; min-width: 0; min-height: 0; margin-top: 1.5rem; overflow: auto; }
    #amendment-list { margin: 0; padding-left: 2.25em; }
    #amendment-list li { margin: 0.85rem 0; }
    #amendment-list li.current-amendment { padding: 0.5rem; border: 1px solid #aeb7bd; }
    #amendment-list a { color: inherit; }
    #amendment-list time { display: block; }
    #amendment-list .amendment-title { display: block; }
    #amendment-list li.current-amendment time, #amendment-list li.enforced-amendment time,
    #amendment-list .revision-status { display: inline; }
    #amendment-list li.current-amendment time, #amendment-list li.enforced-amendment time,
    #amendment-list .revision-status { font-weight: 700; }
    #amendment-list a, #amendment-list span { overflow-wrap: anywhere; }
    #toc-list { list-style: none; margin: 0; padding: 0; }
    #toc-list li { margin: 0.45rem 0; line-height: 1.45; }
    #toc-list .toc-top-level:not(:first-child) { position: relative; margin-top: 2.9rem; }
    #toc-list .toc-top-level:not(:first-child)::before { position: absolute; top: -1.45rem; right: 0; left: 0; border-top: 1px solid #aeb7bd; content: ""; }
    #toc-list .toc-link { display: grid; width: 100%; grid-template-columns: var(--toc-number-width, 4em) minmax(0, 1fr) 8.5em; align-items: baseline; column-gap: 0.75rem; color: inherit; text-decoration: none; }
    #toc-list .toc-top-level .toc-link { color: inherit; font-weight: 700; }
    #toc-list .toc-sublevel .toc-link { font-weight: 700; }
    #toc-list .toc-detail .toc-link { font-weight: 400; }
    #toc-list .toc-number { grid-column: 1; justify-self: end; white-space: nowrap; }
    #toc-list .toc-heading { grid-column: 2; min-width: 0; }
    #toc-list .article-range { grid-column: 3; text-align: right; white-space: nowrap; }
    #law-main { min-width: 0; }
    #law-number { margin-top: -0.5rem; }
    #content { margin-top: 2rem; }
    #content .law-structure-part, #content .law-structure-chapter { scroll-margin-top: 0.5rem; }
    #content .law-structure-section, #content .law-structure-subsection, #content .law-structure-division { scroll-margin-top: calc(0.5rem + var(--sticky-major-height, 3rem) + var(--sticky-chapter-height, 2.5rem)); }
    #content .law-article { scroll-margin-top: calc(0.5rem + var(--sticky-major-height, 3rem) + var(--sticky-chapter-height, 2.5rem)); }
    #content section { margin: 1.5rem 0; }
    #content h2, #content h3, #content h4, #content h5, #content h6 { margin: 1.5rem 0 0.75rem; }
    #content p { margin: 0.75rem 0; line-height: 1.8; }
    #content .article-heading { color: #0047ab; }
    #content .article-heading strong[data-article-number] { color: #202a31; }
    #content hr.article-separator { margin: 1.5rem 0; border: 0; border-top: 1px solid #d8dcdf; }
    #content h2 { font-size: 1.75rem; }
    #content h3 { font-size: 1.5rem; }
    #content h4 { font-size: 1.3rem; }
    #content h5 { font-size: 1.15rem; }
    #content h6 { font-size: 1.05rem; }
    #content h2, #content h3 { margin: 0; padding: 0.45rem 0; border-bottom: 2px solid #505a60; background: #fff; box-sizing: border-box; }
    #content h2 { position: sticky; top: 0.5rem; z-index: 3; min-height: var(--sticky-major-height, 3rem); display: flex; align-items: flex-end; }
    #content h3 { position: sticky; top: calc(0.5rem + var(--sticky-major-height, 3rem)); z-index: 2; min-height: var(--sticky-chapter-height, 2.5rem); display: flex; align-items: flex-end; }
    #content .law-paragraph { margin: 1rem 0; }
    #content .law-sentence { margin: 0.5rem 0; line-height: 1.8; }
    #content .law-sentence.has-number { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); }
    #content .paragraph-number { grid-column: 1; }
    #content .law-sentence.has-number > .sentence-text { grid-column: 2; }
    #content .law-list { margin: 0.75rem 0 0.75rem 2em; padding: 0.65rem 0.8rem; border: 1px solid #aeb7bd; }
    #content .law-item { display: grid; grid-template-columns: 2.5em minmax(0, 1fr); align-items: start; gap: 0 0.5rem; margin: 0.25rem 0; }
    #content .law-list > .law-item { margin-left: 0; }
    #content .law-item > .item-number { grid-column: 1; line-height: 1.8; }
    #content .law-item > .law-sentence { grid-column: 2; margin-top: 0; }
    #content .law-item > .law-item-columns { grid-column: 2; display: grid; align-items: start; column-gap: 1.25em; }
    #content .law-item-columns p { margin: 0; }
    #content .law-item-column.compact-value { text-align: right; white-space: nowrap; }
    #content .law-item > section { grid-column: 2; }
    #content .law-item > .law-list { grid-column: 1 / -1; margin: 0.5rem 0 0.5rem 1rem; }
    #content .subitem1 { margin-left: 1.5em; }
    #content .subitem2 { margin-left: 3em; }
    #content .subitem3, #content .subitem4 { margin-left: 4.5em; }
    footer { margin-top: 3rem; }
    @media (max-width: 115rem) {
      #layout.has-toc:not(.has-metadata) { grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); }
      #layout.has-metadata:not(.has-toc) { grid-template-columns: minmax(0, 1fr) minmax(0, 14rem); }
      #layout.has-toc.has-metadata { grid-template-columns: minmax(0, 20rem) minmax(0, 1fr) minmax(0, 14rem); }
    }
    @media (max-width: 75rem) {
      #layout.has-toc.has-metadata { grid-template-columns: minmax(0, 1fr) minmax(0, 14rem); }
      #layout.has-toc.has-metadata #left-rail { grid-column: 1 / -1; position: static; max-height: none; }
      #layout.has-toc.has-metadata #toc-panel { max-height: 18rem; }
    }
    @media (max-width: 48rem) {
      main { width: calc(100% - 2rem); margin: 2rem auto; }
      #layout { display: block; }
      #left-rail, #right-rail { position: static; height: auto; max-height: none; margin-bottom: 2rem; }
      #toc-panel { max-height: none; }
      #metadata-panel, #amendment-panel { max-height: none; overflow: visible; }
    }
  </style>
</head>
<body>
  <main>
    <div id="layout">
      <div id="left-rail" hidden>
        <aside id="article-jump-panel" aria-label="条文へ移動">
          <form id="article-jump">
            <label for="article-jump-input">条文番号へ移動（/）</label>
            <div id="article-jump-controls">
              <input id="article-jump-input" type="search" inputmode="text" placeholder="例：424条の2 / 424-2" autocomplete="off">
              <button type="submit">移動</button>
            </div>
            <p id="article-jump-status" role="status" aria-live="polite"></p>
          </form>
        </aside>
        <aside id="toc-panel" aria-label="目次">
          <h2>目次</h2>
          <nav id="toc" aria-label="法令の目次"></nav>
        </aside>
      </div>
      <div id="law-main">
        <h1 id="title">法令本文</h1>
        <p id="law-number"></p>
        <p id="status" role="status" aria-live="polite">法令本文を読み込んでいます…</p>
        <article id="content" hidden></article>
        <footer>
          <p>本文データ：<a href="https://laws.e-gov.go.jp/">e-Gov法令検索</a></p>
        </footer>
      </div>
      <div id="right-rail" hidden>
        <aside id="metadata-panel" aria-label="法令情報">
          <h2>法令情報</h2>
          <dl id="metadata-list"></dl>
        </aside>
        <aside id="amendment-panel" aria-label="改正履歴">
          <h2>改正履歴</h2>
          <ol id="amendment-list"></ol>
        </aside>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
