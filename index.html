  <main>
    <div id="layout">
      <div id="left-rail" hidden>
        <aside id="article-jump-panel" aria-label="条文へ移動・語句検索">

            <span class="search-hit-count" aria-live="polite"></span>
            <button type="button" data-search-step="-1" aria-label="前の検索結果へ">前へ</button>
            <button type="button" data-search-step="1" aria-label="次の検索結果へ">次へ</button>
            <button type="button" data-search-close aria-label="検索を終了">✕</button>
          </div>
        </div>
          <form id="article-jump">
            <div id="article-jump-controls">
              <button id="previous-marker" type="button" aria-label="直前のURLマーカーへ戻る" disabled>戻</button>

              <button id="keyboard-toggle" type="button" aria-controls="article-jump-input">番号</button>
              <button type="submit">検索</button>
              <button id="next-marker" type="button" aria-label="次のURLマーカーへ進む" disabled>進</button>
            </div>
          </form>
        </aside>
        <aside id="toc-panel" aria-label="目次">
          <h2>目次</h2>
          <nav id="toc" aria-label="法令の目次"></nav>
        </aside>
      </div>
      <div id="law-main">
        <h1 id="title">いつでも法令閲覧</h1>
        <p id="status" role="status" aria-live="polite">読み込んでいます…</p>
        <section id="search-page" hidden>
          <form id="law-search">
            <label for="search-query">法令を検索</label>
            <input id="search-query" type="search" name="keyword" placeholder="法令名、法令番号、法令ID" required>
            <button type="submit">検索</button>
          </form>
