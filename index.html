<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日本の法令本文を検索・閲覧できます。法令名や法令番号から探し、条文と改正履歴を確認できます。">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="法令本文">
  <meta property="og:title" content="法令検索 | 法令本文">
  <meta property="og:description" content="日本の法令本文を検索・閲覧できます。法令名や法令番号から探し、条文と改正履歴を確認できます。">
  <meta name="twitter:card" content="summary">
  <title>法令検索 | 法令本文</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(calc(100% - 3rem), 110rem); margin: 0 auto; }
    #layout { display: grid; width: 100%; min-width: 0; grid-template-columns: minmax(0, 62rem); gap: 2rem; align-items: start; }
    #layout.has-toc { grid-template-columns: 25rem minmax(0, 62rem); }
    #layout.has-metadata:not(.has-toc) { grid-template-columns: minmax(0, 62rem) 16rem; }
    #layout.has-toc.has-metadata { grid-template-columns: 25rem minmax(0, 62rem) 16rem; }
    #layout:not(.has-toc) { justify-content: center; }
    #left-rail, #toc-panel, #law-main, #right-rail { min-width: 0; }
    #left-rail[hidden], #right-rail[hidden] { display: none; }
    #left-rail { position: sticky; top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; max-height: calc(100vh - 3rem); min-height: 0; }
    #article-jump-panel { flex: 0 0 auto; }
    #toc-panel { flex: 1 1 auto; min-height: 0; overflow: auto; }
    #toc-panel h2 { margin: 0 0 1rem; font-size: 1.1rem; }
    #article-jump { margin: 0; }
    #article-jump-panel #home-link { display: inline-block; margin-bottom: 1rem; color: #0047ab; }
    #article-jump-panel #home-link[hidden] { display: none; }
    #article-jump-controls { display: flex; gap: 0.5rem; }
    #article-jump-input { flex: 1 1 auto; min-width: 0; }
    #right-rail { position: sticky; top: 1.5rem; align-self: start; display: flex; flex-direction: column; height: calc(100vh - 3rem); min-height: 0; }
    #right-nav { flex: 0 0 auto; display: flex; gap: 1rem; padding: 0.25rem 0 0.75rem; background: #fff; }
    #right-nav a { color: inherit; }
    #right-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    #right-rail h2 { margin: 0 0 0.75rem; font-size: 1.1rem; scroll-margin-top: 3rem; }
    #right-rail section + section { margin-top: 5rem; }
    #right-rail dl { margin: 0; }
    #right-rail .metadata-row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 0.6rem; margin-top: 0.65rem; }
    #right-rail dt { flex: 0 0 auto; font-weight: 700; }
    #right-rail dd { flex: 1 1 8rem; min-width: 8rem; margin: 0; overflow-wrap: anywhere; }
    #right-rail .metadata-row:not(.metadata-row-stacked) dd { text-align: right; }
    #right-rail .metadata-row-stacked dd { text-align: left; }
    #right-rail .metadata-status-not-current dd { color: #b42318; }
    #right-rail .metadata-row-stacked dd { flex: 1 0 100%; min-width: 0; padding-left: 0.75rem; }
    #right-rail .metadata-section-row { grid-column: 1 / -1; margin-top: 1.2rem; padding-top: 0.55rem; border-top: 1px solid #aeb7bd; }
    #metadata-list .external-link-mark { white-space: nowrap; font-size: 0.85em; }
    #metadata-panel, #amendment-panel { flex: 0 0 auto; min-width: 0; }
    #amendment-list { margin: 0; padding-left: 2.25em; }
    #amendment-list li { margin: 0.85rem 0; }
    #amendment-list li.current-amendment { padding: 0.5rem; border: 1px solid #aeb7bd; }
    #amendment-list a { color: inherit; text-decoration: none; }
    #amendment-list time { display: block; }
    #amendment-list .amendment-title { display: block; }
    #amendment-list li.current-amendment time, #amendment-list li.enforced-amendment time,
    #amendment-list .revision-status { display: inline; }
    #amendment-list li.current-amendment time, #amendment-list li.enforced-amendment time,
    #amendment-list .revision-status { font-weight: 700; }
    #amendment-list li.enforced-amendment time, #amendment-list li.enforced-amendment .revision-status { text-decoration: underline; }
    #amendment-list a, #amendment-list span { overflow-wrap: anywhere; }
    #toc-list { list-style: none; margin: 0; padding: 0; }
    #toc-list li { margin: 0.45rem 0; line-height: 1.45; }
    #toc-list .toc-part.toc-top-level:not(:first-child) { position: relative; margin-top: 2.9rem; }
    #toc-list .toc-part.toc-top-level:not(:first-child)::before { position: absolute; top: -1.45rem; right: 0; left: 0; border-top: 1px solid #aeb7bd; content: ""; }
    #toc-list .toc-supplementary-entries { list-style: none; margin: 0; padding: 0; }
    #toc-list .toc-link { display: grid; width: 100%; grid-template-columns: var(--toc-number-width, 4em) minmax(0, 1fr) max-content; align-items: baseline; column-gap: 0.75rem; color: inherit; text-decoration: none; }
    #toc-list .toc-part .toc-link[aria-current="location"],
    #toc-list .toc-chapter .toc-link[aria-current="location"],
    #toc-list .toc-detail .toc-link[aria-current="location"] { color: #0047ab; }
    #toc-list .toc-part .toc-link, #toc-list .toc-chapter .toc-link { color: inherit; font-weight: 700; }
    #toc-list .toc-chapter.toc-chapter-leaf .toc-link { font-weight: 400; }
    #toc-list .toc-detail .toc-link { font-weight: 400; }
    #toc-list .toc-number { grid-column: 1; justify-self: end; white-space: nowrap; }
    #toc-list .toc-supplementary-heading > .toc-link > .toc-number { justify-self: end; }
    #toc-list .toc-heading { grid-column: 2; min-width: 0; }
    #toc-list .article-range { grid-column: 3; text-align: right; white-space: nowrap; }
    #toc-list .toc-supplementary-provision .toc-link { grid-template-columns: var(--toc-number-width, 4em) minmax(0, 1fr); }
    #toc-list .toc-supplementary-provision .toc-link, #toc-list .toc-supplementary-provision .toc-number { font-weight: 400; }
    #law-main { min-width: 0; }
    #search-page { max-width: 48rem; margin: 4rem auto; }
    #search-page form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
    #search-page label { grid-column: 1 / -1; font-weight: 700; }
    #search-query { flex: 1; min-width: 0; padding: 0.75rem; font: inherit; }
    #popular-laws { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-top: 0.75rem; }
    #popular-laws a { color: #0047ab; }
    #search-results { padding-left: 1.5rem; }
    #search-results li { margin: 1rem 0; }
    #content { margin-top: 2rem; }
    #content .law-structure-part, #content .law-structure-chapter { scroll-margin-top: 0.5rem; }
    #content .law-structure-section, #content .law-structure-subsection, #content .law-structure-division { scroll-margin-top: calc(0.5rem + var(--sticky-major-height, 3rem) + var(--sticky-chapter-height, 2.5rem)); }
    #content .law-article { scroll-margin-top: calc(0.5rem + var(--sticky-major-height, 3rem) + var(--sticky-chapter-height, 2.5rem)); }
    #content .law-parenthetical { color: #667085; }
    #content .law-quotation, #content .law-quotation .law-parenthetical { color: #000; }
    #content section { margin: 1.5rem 0; }
    #content section.law-article { margin: 0.5rem 0; }
    #content h2, #content h3, #content h4, #content h5, #content h6 { margin: 1.5rem 0 0.75rem; }
    #content p { margin: 0.75rem 0; line-height: 1.8; }
    #content .article-heading { margin: 0.25rem 0; color: #0047ab; }
    #content .article-heading strong[data-article-number] { color: #202a31; }
    #content .law-supplementary-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-bottom: 0.45rem; border-bottom: 1px solid #aeb7bd; font-size: 1.25rem; font-weight: 700; }
    #content .law-supplementary-law-number { text-align: right; font-size: 0.75em; font-weight: 400; overflow-wrap: anywhere; }
    #content hr.article-separator { margin: 1rem 0; border: 0; border-top: 1px solid #d8dcdf; }
    #content h2 { font-size: 1.75rem; }
    #content h3 { font-size: 1.5rem; }
    #content h4 { font-size: 1.3rem; }
    #content h5 { font-size: 1.15rem; }
    #content h6 { font-size: 1.05rem; }
    #content h2, #content h3 { margin: 0; padding: 0.45rem 0; border-bottom: 2px solid #505a60; background: #fff; box-sizing: border-box; }
    #content h2 { position: sticky; top: 0.5rem; z-index: 3; min-height: var(--sticky-major-height, 3rem); display: flex; align-items: flex-end; }
    #content h3 { position: sticky; top: calc(0.5rem + var(--sticky-major-height, 3rem)); z-index: 2; min-height: var(--sticky-chapter-height, 2.5rem); display: flex; align-items: flex-end; }
    #content h2, #content h3, #content h4, #content h5, #content h6, #content .article-heading { cursor: pointer; }
    #content .law-structure-part:has(.law-structure-chapter) > h2 { position: static; min-height: 0; }
    #content .law-structure-chapter:has(.sticky-part-title) > h3 { top: 0.5rem; white-space: nowrap; overflow: hidden; }
    #content .sticky-part-title { display: none; margin-right: 3rem; flex: 0 0 auto; }
    #content h3.is-sticky .sticky-part-title { display: inline; }
    #content .law-paragraph { margin: 0; }
    #content .law-sentence { margin: 0.35rem 0; line-height: 1.8; }
    #content .law-sentence.has-number { display: grid; grid-template-columns: 3.5em minmax(0, 1fr); }
    #content .paragraph-number { grid-column: 1; }
    #content .law-sentence.has-number > .sentence-text { grid-column: 2; }
    #content .law-list { margin: 0.75rem 0 0.75rem 2em; padding: 0.65rem 0.8rem; border: 1px solid #aeb7bd; }
    #content .law-item { display: grid; grid-template-columns: max-content minmax(0, 1fr); align-items: start; gap: 0 0.5rem; margin: 0.25rem 0; }
    #content .law-list > .law-item { margin-left: 0; }
    #content .law-item > .item-number { grid-column: 1; line-height: 1.8; white-space: nowrap; }
    #content .law-item > .law-sentence { grid-column: 2; margin-top: 0; }
    #content .law-item > .law-item-columns { grid-column: 2; display: grid; align-items: start; column-gap: 1.25em; }
    #content .law-item-columns p { margin: 0; }
    #content .law-item > section { grid-column: 2; }
    #content .law-item > .law-list { grid-column: 1 / -1; margin: 0.5rem 0 0.5rem 1rem; }
    #content .subitem1 { margin-left: 1.5em; }
    #content .subitem2 { margin-left: 3em; }
    #content .subitem3, #content .subitem4 { margin-left: 4.5em; }
    footer { margin-top: 3rem; }
    @media (max-width: 115rem) {
      #layout.has-toc:not(.has-metadata) { grid-template-columns: minmax(0, 20rem) minmax(0, 1fr); }
      #layout.has-metadata:not(.has-toc) { grid-template-columns: minmax(0, 1fr) minmax(0, 14rem); }
      #layout.has-toc.has-metadata { grid-template-columns: minmax(0, 20rem) minmax(0, 1fr) minmax(0, 14rem); }
    }
    @media (max-width: 75rem) {
      #layout.has-toc.has-metadata { grid-template-columns: minmax(0, 1fr) minmax(0, 14rem); }
      #layout.has-toc.has-metadata #left-rail { grid-column: 1 / -1; position: static; max-height: none; }
      #layout.has-toc.has-metadata #toc-panel { max-height: 18rem; }
    }
    @media (max-width: 48rem) {
      main { width: calc(100% - 2rem); margin: 0 auto; }
      #layout { display: block; }
      #left-rail, #right-rail { position: static; height: auto; max-height: none; margin-bottom: 2rem; }
      #right-scroll { overflow: visible; }
      #toc-panel { max-height: none; }
      #metadata-panel, #amendment-panel { max-height: none; overflow: visible; }
    }
  </style>
</head>
<body>
  <main>
    <div id="layout">
      <div id="left-rail" hidden>
        <aside id="article-jump-panel" aria-label="条文へ移動">
          <a id="home-link" href="/" hidden>検索ページに戻る</a>
          <form id="article-jump">
            <div id="article-jump-controls">
              <button id="previous-marker" type="button" aria-label="直前のURLマーカーへ戻る" disabled>◀</button>
              <input id="article-jump-input" type="search" inputmode="text" aria-label="条文番号へ移動（スラッシュキーでフォーカス）" placeholder="条文番号へ移動（例：424条の2 / 424-2）" autocomplete="off">
              <button id="next-marker" type="button" aria-label="次のURLマーカーへ進む" disabled>▶</button>
              <button type="submit">移動</button>
            </div>
          </form>
        </aside>
        <aside id="toc-panel" aria-label="目次">
          <h2>目次</h2>
          <nav id="toc" aria-label="法令の目次"></nav>
        </aside>
      </div>
      <div id="law-main">
        <h1 id="title">法令本文</h1>
        <p id="status" role="status" aria-live="polite">法令本文を読み込んでいます…</p>
        <section id="search-page" hidden>
          <form id="law-search">
            <label for="search-query">法令を検索</label>
            <input id="search-query" type="search" name="keyword" placeholder="法令名、キーワード、法令ID" required>
            <button type="submit">検索</button>
          </form>
          <nav id="popular-laws" aria-label="主な法令">
            <a href="?id=321CONSTITUTION">憲法</a>
            <a href="?id=129AC0000000089">民法</a>
            <a href="?id=132AC0000000048">商法</a>
            <a href="?id=417AC0000000086">会社法</a>
            <a href="?id=140AC0000000045">刑法</a>
            <a href="?id=408AC0000000109">民事訴訟法</a>
            <a href="?id=323AC0000000131">刑事訴訟法</a>
          </nav>
          <p id="search-status" role="status" aria-live="polite"></p>
          <ol id="search-results"></ol>
        </section>
        <article id="content" hidden></article>
        <footer>
          <p>出典：<a href="https://laws.e-gov.go.jp/">e-Gov法令検索</a></p>
        </footer>
      </div>
      <div id="right-rail" hidden>
        <nav id="right-nav" aria-label="右パネル内の項目">
          <a href="#metadata-heading">▲法令情報</a>
          <a href="#amendment-heading">▼改正一覧</a>
        </nav>
        <div id="right-scroll">
          <section id="metadata-panel" aria-labelledby="metadata-heading">
            <h2 id="metadata-heading">法令情報</h2>
            <dl id="metadata-list"></dl>
          </section>
          <section id="amendment-panel" aria-labelledby="amendment-heading">
            <h2 id="amendment-heading">改正一覧</h2>
            <ol id="amendment-list"></ol>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
